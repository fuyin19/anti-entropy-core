[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-entropy-core"
version = "1.2.0"
description = "Minimal local authority for knowledge-unit and collaborative-workspace contracts"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
anti_entropy_core = ["resources/*.md"]
